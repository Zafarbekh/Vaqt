name: APK yig'ish
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fayllarni joylashtirish
        run: |
          mkdir -p www/sounds assets
          mv index.html icon.svg www/
          mv azon1.mp3 azon2.mp3 www/sounds/
          mv icon.png assets/
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Ruxsatlarni qo'shish
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in VIBRATE CAMERA ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED WAKE_LOCK; do
            sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n    <application#" $M
          done
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Vaqt-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
